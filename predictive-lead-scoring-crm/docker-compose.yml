services:
  app:
    build:
      context: ./docker/php
    container_name: predictive-crm-app
    working_dir: /var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: predictive_crm
      DB_USERNAME: root
      DB_PASSWORD: root123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_TIMEOUT: 30
      LEAD_SCORING_ENABLED: "true"
      LEAD_SCORING_BATCH_SIZE: 100
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - ml-service

  ml-service:
    build:
      context: .
      dockerfile: ./docker/ml/Dockerfile
    container_name: predictive-crm-ml-service
    ports:
      - "8001:8001"
    environment:
      ML_PORT: 8001
    volumes:
      - ./ml:/app

  redis:
    image: redis:7-alpine
    container_name: predictive-crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  horizon:
    build:
      context: ./docker/php
    container_name: predictive-crm-horizon
    working_dir: /var/www
    command: ["php", "artisan", "horizon"]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: predictive_crm
      DB_USERNAME: root
      DB_PASSWORD: root123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_TIMEOUT: 30
    volumes:
      - ./backend:/var/www
    depends_on:
      - app
      - redis
      - mysql
      - ml-service

  mysql:
    image: mysql:8.0
    container_name: predictive-crm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: predictive_crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: predictive-crm-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
  redis_data:
